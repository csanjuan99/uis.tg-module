services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
         test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
         interval: 10s
         timeout: 5s
         retries: 5
         start_period: 40s

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: ${APP_DATABASE_URI}
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb

  backend-saam:
    image: saam-backend:latest
    container_name: saam-backend
    restart: always
    build:
        context: .
        dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      APP_DATABASE_URI: ${APP_DATABASE_URI}
      MAILTRAP_HOST: ${MAILTRAP_HOST}
      MAILTRAP_TOKEN: ${MAILTRAP_TOKEN}
      MAILTRAP_SENDER_NAME: ${MAILTRAP_SENDER_NAME}
      MAILTRAP_SENDER_EMAIL: ${MAILTRAP_SENDER_EMAIL}
      DAYJS_START: ${DAYJS_START}
      ACADEMIC_YEAR: ${ACADEMIC_YEAR}
      ACADEMIC_TERM: ${ACADEMIC_TERM}

volumes:
  mongodb_data:
  mongodb_config: